# Containux USB driver blacklist (GUIDE.md §4.2)
#
# The host kernel must never load its own drivers for USB peripherals:
# every device is passed raw to the guest through QEMU's usb-host, and a
# host-side driver would race the guest for exclusive access to the
# hardware. usbhid and uvcvideo are the usual offenders.
#
# /init removes this file temporarily during OS installation, so usbhid can
# relay the primary keyboard/mouse through evdev to QEMU's emulated PS/2
# ports (GUIDE.md §5.1). It stays in force for every normal boot.
blacklist usbhid
blacklist uvcvideo
